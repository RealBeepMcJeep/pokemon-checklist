---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ubuntu-latest only, by choice: the maintainer already develops and runs the
  # full suite on Windows locally before every push, and the two OS-specific
  # risks that would justify a second job -- CRLF creeping into the committed
  # index.html, and cache paths under a Windows-only directory -- are guarded
  # by tools/publish.mjs's (now two-sided) line-ending normalization and by
  # cache_support.py's per-OS cache directory helper, not by CI. A windows-latest
  # job would roughly double this workflow's run time (a second full
  # `npx playwright install --with-deps` and `npm run check`) for a personal,
  # single-maintainer project; add one if a second contributor without local
  # Windows access starts pushing changes.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python tools/extract_reference.py --validate
      - run: >-
          python -m py_compile
          tools/validate_data.py
          tools/build_vanilla_encounters.py
          tools/build_pokedex_details.py
          tools/extract_reference.py
          tools/build_icons.py
          tools/showdown_data.py
          tools/moveline.py
          tools/build_moves.py
          tools/roster_lens.py
          tools/catcher_score.py
          tools/pokemon_ops.py
          tools/team_builder.py
          tools/qr_codec.py
          tools/build_qr_catalog.py
          tools/build_qr_gallery.py
      - run: npm run check
      - run: npm run test:e2e
